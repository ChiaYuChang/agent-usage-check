name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check formatting
        run: |
          set -eu
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "${unformatted}" ]; then
            echo "Unformatted files:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

      - name: Run unit and matrix tests
        run: go test -v ./...

      - name: Run go vet
        run: go vet ./...
